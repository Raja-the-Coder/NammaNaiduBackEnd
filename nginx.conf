# ============================================
# Nginx Configuration for NammaNaidu
# Backend API + Frontend Static Files
# ============================================
#
# Installation on VPS:
#   1. Copy: sudo cp nginx.conf /etc/nginx/sites-available/nammanaidu
#   2. Enable: sudo ln -s /etc/nginx/sites-available/nammanaidu /etc/nginx/sites-enabled/
#   3. Remove default: sudo rm /etc/nginx/sites-enabled/default
#   4. Test: sudo nginx -t
#   5. Reload: sudo systemctl reload nginx
#
# SSL Setup (after pointing domain):
#   sudo certbot --nginx -d yourdomain.com -d api.yourdomain.com
#

# Rate limiting zone
limit_req_zone $binary_remote_addr zone=api_limit:10m rate=10r/s;
limit_req_zone $binary_remote_addr zone=general_limit:10m rate=30r/s;

# Upstream for Node.js backend
upstream nammanaidu_backend {
    server 127.0.0.1:5000;
    keepalive 64;
}

# ============================================
# Main Server - Frontend + API
# ============================================
server {
    listen 80;
    listen [::]:80;
    server_name 46.202.160.54;  # Replace with your domain when ready

    # Security headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;

    # Gzip compression
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_types text/plain text/css text/xml text/javascript application/javascript application/x-javascript application/xml application/json image/svg+xml;

    # Rate limiting for general requests
    limit_req zone=general_limit burst=50 nodelay;

    # Frontend - Serve static files
    root /var/www/nammanaidu/frontend;
    index index.html;

    # Frontend routes - SPA fallback
    location / {
        try_files $uri $uri/ /index.html;
        
        # Cache static assets
        location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
            expires 1y;
            add_header Cache-Control "public, immutable";
        }
    }

    # Backend API proxy
    location /api/ {
        limit_req zone=api_limit burst=20 nodelay;
        
        proxy_pass http://nammanaidu_backend;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
        proxy_read_timeout 86400;
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
    }

    # Health check endpoint
    location /health {
        proxy_pass http://nammanaidu_backend;
        access_log off;
    }

    # Let's Encrypt verification
    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    # Deny access to hidden files
    location ~ /\. {
        deny all;
    }
}

